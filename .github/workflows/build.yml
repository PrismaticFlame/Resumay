name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'   # triggers when tag like v1.0.0 is pushed

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
        
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
        
      - name: Install frontend Dependencies
        run: npm ci

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch Tectonic sidecar (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          curl -L "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-aarch64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp
          mv /tmp/tectonic src-tauri/binaries/tectonic-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/tectonic-x86_64-unknown-linux-gnu
      
      - name: Fetch Tectonic sidecar (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries
          Invoke-WebRequest "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-pc-windows-msvc.zip" -OutFile tectonic.zip
          Expand-Archive tectonic.zip -DestinationPath tectonic-tmp
          Move-Item tectonic-tmp/tectonic.exe src-tauri/binaries/tectonic-x86_64-pc-windows-msvc.exe
        
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Resumay ${{ github.ref_name }}
          releaseBody: |
            ## Download
            - **Windows**: download the `.msi` or `-setup.exe` file
            - **Linux**: download the `.deb` (Debian/Ubuntu/Manjaro) or `.AppImage` (universal)
          releaseDraft: false
          prerelease: false
    